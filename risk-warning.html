<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>供应链风险预警 - 产业链/供应链图谱系统</title>
  <link rel="stylesheet" href="css/common.css?v=3">
  <link rel="stylesheet" href="css/risk-warning.css?v=1">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/data.js"></script>
    <!-- 加载顺序必须先配置、后组件，顺序不能颠倒 -->
  <script src="js/config/menu-config.js"></script>
  <script src="js/components/GovHeader.js"></script>
  <script src="js/components/SideNav.js"></script>
</head>
<body>
  <gov-header></gov-header>    
  <div class="page-layout">
    <side-nav></side-nav>

    <main class="page-content">
      <section class="top-bar">
        <div class="breadcrumb" id="breadcrumbContainer"></div>
        <div class="top-actions">
          <button class="btn btn-default" onclick="window.location.href='index.html'">← 返回看板</button>
          <button class="btn btn-primary" onclick="exportRiskReport()">导出预警报告</button>
        </div>
      </section>

      <section class="risk-stats">
        <div class="metric-card" id="statUrgent">
          <div class="metric-icon" style="background:#FFF1F0;color:#F5222D">🚨</div>
          <div class="metric-content">
            <div class="metric-label">紧急预警</div>
            <div class="metric-value" style="color:#F5222D" id="urgentCount">0</div>
          </div>
        </div>
        <div class="metric-card" id="statImportant">
          <div class="metric-icon" style="background:#FFF7E6;color:#FA8C16">⚠️</div>
          <div class="metric-content">
            <div class="metric-label">重要预警</div>
            <div class="metric-value" style="color:#FA8C16" id="importantCount">0</div>
          </div>
        </div>
        <div class="metric-card" id="statNormal">
          <div class="metric-icon" style="background:#FFFBE6;color:#FAAD14">🔔</div>
          <div class="metric-content">
            <div class="metric-label">关注预警</div>
            <div class="metric-value" style="color:#FAAD14" id="normalCount">0</div>
          </div>
        </div>
        <div class="metric-card" id="statTotal">
          <div class="metric-icon" style="background:#E6F7FF;color:#1890FF">📊</div>
          <div class="metric-content">
            <div class="metric-label">预警总数</div>
            <div class="metric-value" style="color:#1890FF" id="totalCount">0</div>
          </div>
        </div>
      </section>

      <section class="risk-filter card">
        <div class="filter-row">
          <div class="filter-item">
            <label>风险等级</label>
            <select id="levelFilter" onchange="applyRiskFilters()">
              <option value="">全部等级</option>
              <option value="紧急">紧急</option>
              <option value="重要">重要</option>
              <option value="关注">关注</option>
            </select>
          </div>
          <div class="filter-item">
            <label>风险类型</label>
            <select id="typeFilter" onchange="applyRiskFilters()">
              <option value="">全部类型</option>
              <option value="经营异常">经营异常</option>
              <option value="司法风险">司法风险</option>
              <option value="税务异常">税务异常</option>
              <option value="迁出风险">迁出风险</option>
              <option value="供应商依赖">供应商依赖</option>
            </select>
          </div>
          <div class="filter-item">
            <label>处理状态</label>
            <select id="statusFilter" onchange="applyRiskFilters()">
              <option value="">全部状态</option>
              <option value="未处理">未处理</option>
              <option value="处理中">处理中</option>
              <option value="已处理">已处理</option>
            </select>
          </div>
          <button class="btn btn-default" onclick="resetRiskFilters()">重置</button>
        </div>
      </section>

      <section class="risk-main">
        <aside class="risk-list card">
          <div class="card-header">
            <div class="card-title" style="--title-bar-color:#F5222D">预警列表</div>
            <span class="list-count" id="listCount">共 0 条</span>
          </div>
          <div class="risk-items" id="riskItems"></div>
        </aside>

        <div class="risk-detail">
          <div class="card detail-card" id="detailCard">
            <div class="empty-state">
              <div class="empty-state-icon">⚠️</div>
              <div class="empty-state-title">请选择左侧预警项查看详情</div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/risk-warning.js"></script>
</body>
</html>
