<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企业关系网络 - 产业链/供应链图谱系统</title>
  <link rel="stylesheet" href="css/common.css?v=3">
  <link rel="stylesheet" href="css/enterprise-network.css?v=1">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/data.js"></script>
</head>
<body>
  <header class="gov-header">
    <div class="gov-header-left">
      <div class="gov-logo">🏭</div>
      <div class="gov-title">产业链/供应链图谱系统</div>
      <div class="gov-subtitle">产业治理智能中枢</div>
    </div>
    <div class="gov-header-right">
      <div id="globalSearchContainer"></div>
      <span>📅 2026年7月8日</span>
      <div class="gov-user">
        <div class="gov-avatar">政</div>
        <span>区发改局 管理员</span>
      </div>
    </div>
  </header>

  <div class="page-layout">
    <aside class="sidebar">
      <div class="sidebar-title">功能导航</div>
      <nav class="sidebar-menu">
        <div class="sidebar-item" onclick="window.location.href='index.html'">
          <span class="sidebar-icon">▦</span>
          <span>产业全景看板</span>
        </div>
        <div class="sidebar-item active">
          <span class="sidebar-icon">🕸</span>
          <span>企业关系网络</span>
        </div>
        <div class="sidebar-item" onclick="window.location.href='risk-warning.html'">
          <span class="sidebar-icon">⚠️</span>
          <span>风险预警</span>
        </div>
        <div class="sidebar-item" onclick="window.location.href='chain-gap.html'">
          <span class="sidebar-icon">🔧</span>
          <span>强链补链</span>
        </div>
        <div class="sidebar-item" onclick="window.location.href='supply-demand.html'">
          <span class="sidebar-icon">📊</span>
          <span>供需对接</span>
        </div>
      </nav>
    </aside>

    <main class="page-content">
      <section class="top-bar">
        <div class="breadcrumb" id="breadcrumbContainer"></div>
        <div class="top-actions">
          <button class="btn btn-default" onclick="window.location.href='index.html'">← 返回看板</button>
          <button class="btn btn-primary" onclick="exportNetworkReport()">导出网络报告</button>
        </div>
      </section>

      <section class="card filter-card">
        <div class="filter-row">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="搜索企业名称、统一信用代码..." oninput="debounceSearch()">
          </div>
          <div class="filter-groups">
            <div class="filter-item">
              <label>关系类型</label>
              <select id="relationTypeFilter" onchange="applyFilters()">
                <option value="all">全部关系</option>
                <option value="equity">股权关系</option>
                <option value="transaction">交易关系</option>
                <option value="cooperation">合作关系</option>
                <option value="supply_demand">供需推断</option>
              </select>
            </div>
            <div class="filter-item">
              <label>关系强度</label>
              <select id="strengthFilter" onchange="applyFilters()">
                <option value="all">全部强度</option>
                <option value="high">强（≥0.8）</option>
                <option value="medium">中（0.5-0.8）</option>
                <option value="low">弱（<0.5）</option>
              </select>
            </div>
            <div class="filter-item">
              <label>布局算法</label>
              <select id="layoutSelect" onchange="switchLayout()">
                <option value="force">力导向布局</option>
                <option value="hierarchy">层次布局</option>
                <option value="circular">环形布局</option>
              </select>
            </div>
            <button class="btn btn-default" onclick="resetNetworkFilters()">重置</button>
          </div>
        </div>
      </section>

      <section class="network-main">
        <div class="network-canvas card">
          <div id="networkChart"></div>
          <div class="network-toolbar">
            <button class="btn btn-sm btn-default" onclick="zoomOut()">-</button>
            <button class="btn btn-sm btn-default" onclick="zoomReset()">重置</button>
            <button class="btn btn-sm btn-default" onclick="zoomIn()">+</button>
            <span class="zoom-value" id="zoomValue">1.0x</span>
          </div>
          <div class="network-legend">
            <div class="legend-group">
              <span class="legend-title">产业角色</span>
              <span class="legend-item"><i class="dot" style="background:#1890FF"></i>零部件</span>
              <span class="legend-item"><i class="dot" style="background:#52C41A"></i>制造商</span>
              <span class="legend-item"><i class="dot" style="background:#722ED1"></i>集成商</span>
              <span class="legend-item"><i class="dot" style="background:#FA8C16"></i>终端</span>
              <span class="legend-item"><i class="dot" style="background:#13C2C2"></i>服务商</span>
              <span class="legend-item"><i class="dot" style="background:#EB2F96"></i>使能技术</span>
            </div>
            <div class="legend-group">
              <span class="legend-title">关系类型</span>
              <span class="legend-item"><i class="line" style="background:#722ED1"></i>股权</span>
              <span class="legend-item"><i class="line" style="background:#1890FF"></i>交易</span>
              <span class="legend-item"><i class="line dashed" style="background:#52C41A"></i>合作</span>
              <span class="legend-item"><i class="line dotted" style="background:#FA8C16"></i>供需</span>
            </div>
          </div>
        </div>
      </section>

      <section class="path-analysis card">
        <div class="path-header">
          <div class="card-title" style="--title-bar-color:#722ED1">路径分析工具</div>
          <span class="path-desc">选择两个企业，分析它们之间的连接路径与关系强度</span>
        </div>
        <div class="path-body">
          <div class="path-select">
            <label>源企业</label>
            <select id="pathSource" onchange="onPathSelectChange()">
              <option value="">请选择源企业</option>
            </select>
          </div>
          <div class="path-arrow">→</div>
          <div class="path-select">
            <label>目标企业</label>
            <select id="pathTarget" onchange="onPathSelectChange()">
              <option value="">请选择目标企业</option>
            </select>
          </div>
          <button class="btn btn-primary" onclick="analyzePath()" id="btnAnalyzePath" disabled>分析路径</button>
          <button class="btn btn-default" onclick="clearPath()">清除</button>
        </div>
        <div class="path-result" id="pathResult" style="display:none"></div>
      </section>
    </main>
  </div>

  <div class="drawer-overlay" id="drawerOverlay" onclick="closeNetworkDrawer()"></div>
  <aside class="drawer" id="networkDrawer">
    <div class="drawer-header">
      <span class="drawer-title" id="drawerTitle">企业详情</span>
      <button class="drawer-close" onclick="closeNetworkDrawer()">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-footer" id="drawerFooter"></div>
  </aside>

  <script src="js/enterprise-network.js"></script>
</body>
</html>
