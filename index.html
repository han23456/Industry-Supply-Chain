<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>产业全景看板 - 产业链/供应链图谱系统</title>
  <link rel="stylesheet" href="css/common.css?v=15">
  <link rel="stylesheet" href="css/panorama.css?v=13">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="js/data.js?v=4"></script>
  <script src="js/common.js?v=3"></script>
  <script src="js/config/menu-config.js?v=6"></script>
  <script src="js/components/GovHeader.js?v=2"></script>
  <script src="js/components/SideNav.js?v=6"></script>
</head>
<body>
  <gov-header></gov-header>

  <div class="page-layout">
    <side-nav></side-nav>

    <main class="page-content panorama-new">
      <!-- 页面头部 -->
      <header class="panorama-header">
        <div class="panorama-header-bg"></div>
        <div class="panorama-header-content">
          <h1>前海现代化产业体系全景分析</h1>
          <div class="panorama-framework">
            <span class="framework-label">构建核心框架：</span>
            <span class="framework-tag tag-blue">6大现代服务业</span>
            <span class="framework-dot">•</span>
            <span class="framework-tag tag-indigo">4大战略性新兴产业</span>
            <span class="framework-dot">•</span>
            <span class="framework-tag tag-purple">2大未来产业</span>
          </div>
        </div>
      </header>

      <!-- 全局核心指标概览 -->
      <section class="panorama-section">
        <div class="section-title-row">
          <h2><span class="section-icon">📊</span> 全局核心指标概览</h2>
          <span class="update-time">更新时间：2026年7月</span>
        </div>
        <div class="kpi-grid" id="kpiGrid"></div>
        <div class="category-summary-grid" id="categorySummaryGrid"></div>
      </section>

      <!-- 产业板块细分网格矩阵 -->
      <div id="industrySections"></div>
    </main>
  </div>

  <script src="js/panorama.js?v=4"></script>
</body>
</html>
