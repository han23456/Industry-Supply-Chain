<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>供需对接服务 - 产业链/供应链图谱系统</title>
  <link rel="stylesheet" href="css/common.css?v=15">
  <link rel="stylesheet" href="css/supply-demand.css?v=1">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/data.js"></script>
  <script src="js/config/menu-config.js?v=6"></script>
  <script src="js/components/GovHeader.js"></script>
  <script src="js/components/SideNav.js?v=6"></script>
</head>
<body>
  <gov-header></gov-header> 
    
  <div class="page-layout">
    <side-nav></side-nav>

    <main class="page-content">
      <section class="top-bar">
        <div class="breadcrumb" id="breadcrumbContainer"></div>
        <div class="top-actions">
          <button class="btn btn-default" onclick="window.location.href='index.html'">← 返回看板</button>
          <button class="btn btn-primary" onclick="exportMatchReport()">导出对接报告</button>
        </div>
      </section>

      <section class="card mode-card">
        <div class="mode-tabs">
          <div class="mode-tab active" data-mode="who-needs-me" onclick="switchMode('who-needs-me')">
            <div class="mode-icon">🙋‍♂️</div>
            <div class="mode-title">谁需要我</div>
            <div class="mode-desc">匹配本区下游需求企业</div>
          </div>
          <div class="mode-tab" data-mode="i-need-who" onclick="switchMode('i-need-who')">
            <div class="mode-icon">🔍</div>
            <div class="mode-title">我需要谁</div>
            <div class="mode-desc">匹配本区上游供应商</div>
          </div>
          <div class="mode-tab" data-mode="gap-analysis" onclick="switchMode('gap-analysis')">
            <div class="mode-icon">📉</div>
            <div class="mode-title">缺口分析</div>
            <div class="mode-desc">识别本地供需缺口</div>
          </div>
          <div class="mode-tab" data-mode="path-analysis" onclick="switchMode('path-analysis')">
            <div class="mode-icon">🔗</div>
            <div class="mode-title">供需路径</div>
            <div class="mode-desc">分析完整供需链条</div>
          </div>
        </div>
      </section>

      <section class="sd-main">
        <aside class="sd-sidebar card">
          <div class="sd-sidebar-title">企业/产品选择</div>
          <div class="sd-form">
            <div class="form-item">
              <label>选择企业</label>
              <select id="enterpriseSelect" onchange="onEnterpriseChange()">
                <option value="">请选择企业</option>
              </select>
            </div>
            <div class="form-item" id="productSelectBox">
              <label>选择产品/需求</label>
              <select id="productSelect" onchange="onProductChange()">
                <option value="">全部产品/需求</option>
              </select>
            </div>
            <div class="form-item" id="pathProductBox" style="display:none">
              <label>输入产品名称</label>
              <input type="text" id="pathProductInput" placeholder="如：精密减速机" value="精密减速机">
            </div>
            <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="runMatch()" id="btnRunMatch">开始匹配</button>
          </div>
          <div class="sd-stats" id="sdStats"></div>
        </aside>

        <div class="sd-content">
          <div class="card result-card" id="resultCard">
            <div class="card-header">
              <div class="card-title" id="resultTitle" style="--title-bar-color:#1890FF">匹配结果</div>
              <div class="result-actions" id="resultActions"></div>
            </div>
            <div class="result-body" id="resultBody">
              <div class="empty-state">
                <div class="empty-state-icon">📊</div>
                <div class="empty-state-title">请选择企业和匹配模式</div>
                <p>系统将基于产品/需求目录自动计算本地供需匹配度</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>   

  <div class="drawer-overlay" id="drawerOverlay" onclick="closeMatchDrawer()"></div>
  <aside class="drawer" id="matchDrawer">
    <div class="drawer-header">
      <span class="drawer-title" id="matchDrawerTitle">撮合建议</span>
      <button class="drawer-close" onclick="closeMatchDrawer()">✕</button>
    </div>
    <div class="drawer-body" id="matchDrawerBody"></div>
    <div class="drawer-footer" id="matchDrawerFooter"></div>
  </aside>

  <script src="js/supply-demand.js"></script>
</body>
</html>
