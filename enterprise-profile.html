<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企业画像 - 产业链/供应链图谱系统</title>
  <link rel="stylesheet" href="css/common.css?v=3">
  <link rel="stylesheet" href="css/enterprise-profile.css?v=1">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/data.js"></script>
</head>
<body>
  <header class="gov-header">
    <div class="gov-header-left">
      <div class="gov-logo">🏭</div>
      <div class="gov-title">产业链/供应链图谱系统</div>
      <div class="gov-subtitle">产业治理智能中枢</div>
    </div>
    <div class="gov-header-right">
      <div id="globalSearchContainer"></div>
      <span>📅 2026年7月8日</span>
      <div class="gov-user">
        <div class="gov-avatar">政</div>
        <span>区发改局 管理员</span>
      </div>
    </div>
  </header>

  <div class="page-layout">
    <aside class="sidebar">
      <div class="sidebar-title">功能导航</div>
      <nav class="sidebar-menu">
        <div class="sidebar-item" onclick="window.location.href='index.html'">
          <span class="sidebar-icon">▦</span>
          <span>产业全景看板</span>
        </div>
        <div class="sidebar-item" onclick="window.location.href='enterprise-network.html'">
          <span class="sidebar-icon">🕸</span>
          <span>企业关系网络</span>
        </div>
        <div class="sidebar-item" onclick="window.location.href='risk-warning.html'">
          <span class="sidebar-icon">⚠️</span>
          <span>风险预警</span>
        </div>
        <div class="sidebar-item" onclick="window.location.href='chain-gap.html'">
          <span class="sidebar-icon">🔧</span>
          <span>强链补链</span>
        </div>
        <div class="sidebar-item" onclick="window.location.href='supply-demand.html'">
          <span class="sidebar-icon">📊</span>
          <span>供需对接</span>
        </div>
      </nav>
    </aside>

    <main class="page-content">
      <section class="top-bar">
        <div class="breadcrumb" id="breadcrumbContainer"></div>
        <div class="top-actions">
          <button class="btn btn-default" onclick="window.location.href='enterprise-network.html'">← 返回网络</button>
          <button class="btn btn-primary" onclick="window.location.href='supply-demand.html?enterpriseId=' + currentEnterpriseId">查看供需匹配</button>
        </div>
      </section>

      <section class="card profile-header">
        <div class="profile-main">
          <div class="profile-logo" id="profileLogo">企</div>
          <div class="profile-info">
            <div class="profile-title">
              <h1 id="profileName">企业名称</h1>
              <span class="tag tag-primary" id="profileRole">产业角色</span>
              <span class="tag tag-success" id="profileLocal">本区企业</span>
            </div>
            <div class="profile-subtitle" id="profileCode">统一信用代码：-</div>
            <div class="profile-tags" id="profileTags"></div>
          </div>
        </div>
        <div class="profile-metrics" id="profileMetrics"></div>
      </section>

      <section class="profile-tabs">
        <div class="tab active" data-tab="basic" onclick="switchTab('basic')">基本信息</div>
        <div class="tab" data-tab="products" onclick="switchTab('products')">产品/服务</div>
        <div class="tab" data-tab="demands" onclick="switchTab('demands')">需求目录</div>
        <div class="tab" data-tab="relations" onclick="switchTab('relations')">关联企业</div>
        <div class="tab" data-tab="chain" onclick="switchTab('chain')">产业链定位</div>
        <div class="tab" data-tab="risks" onclick="switchTab('risks')">风险状态</div>
      </section>

      <section class="card profile-content" id="tabContent">
        <!-- 动态内容 -->
      </section>
    </main>
  </div>

  <script src="js/enterprise-profile.js"></script>
</body>
</html>
