<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企业画像 - 产业链/供应链图谱系统</title>
  <link rel="stylesheet" href="css/common.css?v=3">
  <link rel="stylesheet" href="css/enterprise-profile.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="js/common.js"></script>
  <!-- 加载上游供应商等强链补链模拟数据，供画像页识别外部企业 ID -->
  <script src="mock/data.js?v=2"></script>
  <script src="js/data.js?v=2"></script>
    <!-- 加载顺序必须先配置、后组件，顺序不能颠倒 -->
  <script src="js/config/menu-config.js"></script>
  <script src="js/components/GovHeader.js"></script>
  <script src="js/components/SideNav.js"></script>
</head>
<body>
  <gov-header></gov-header>
    

  <div class="page-layout">
    <side-nav></side-nav>

    <main class="page-content profile-page">
      <section class="top-bar">
        <div class="breadcrumb" id="breadcrumbContainer"></div>
        <div class="top-actions">
          <button class="btn btn-default" onclick="window.location.href='enterprise-network.html'">← 返回网络</button>
          <button class="btn btn-primary" onclick="window.location.href='supply-demand.html?enterpriseId=' + currentEnterpriseId">查看供需匹配</button>
        </div>
      </section>

      <section class="card profile-header">
        <div class="profile-main">
          <div class="profile-logo" id="profileLogo">企</div>
          <div class="profile-info">
            <div class="profile-title">
              <h1 id="profileName">企业名称</h1>
              <span class="tag tag-primary" id="profileRole">产业角色</span>
              <span class="tag tag-success" id="profileLocal">本区企业</span>
            </div>
            <div class="profile-subtitle" id="profileCode">统一信用代码：-</div>
            <div class="profile-tags" id="profileTags"></div>
          </div>
        </div>
        <div class="profile-metrics" id="profileMetrics"></div>
        <div class="profile-actions">
          <button class="btn btn-default" onclick="window.location.href='enterprise-network.html'">返回网络</button>
          <button class="btn btn-default" onclick="window.location.href='supply-demand.html?enterpriseId=' + currentEnterpriseId">查看供需匹配</button>
          <button class="btn btn-primary" onclick="window.location.href='chain-gap.html?enterpriseId=' + currentEnterpriseId">加入补链分析</button>
        </div>
      </section>

      <div class="profile-content-area">
        <section class="profile-tabs">
          <div class="tab active" data-tab="basic" onclick="switchTab('basic')">基本信息</div>
          <div class="tab" data-tab="business" onclick="switchTab('business')">业务概况</div>
          <div class="tab" data-tab="layout" onclick="switchTab('layout')">企业布局</div>
          <div class="tab" data-tab="supply" onclick="switchTab('supply')">供应链分析</div>
          <div class="tab" data-tab="innovation" onclick="switchTab('innovation')">创新能力</div>
          <div class="tab" data-tab="finance" onclick="switchTab('finance')">财务状况</div>
          <div class="tab" data-tab="risk" onclick="switchTab('risk')">风险信息</div>
          <div class="tab" data-tab="competition" onclick="switchTab('competition')">竞争分析</div>
          <div class="tab" data-tab="history" onclick="switchTab('history')">企业历程</div>
          <div class="tab" data-tab="news" onclick="switchTab('news')">企业动态</div>
          <div class="tab" data-tab="policy" onclick="switchTab('policy')">政策支持</div>
        </section>

        <section class="card profile-content" id="tabContent"></section>
      </div>
    </main>
  </div>

  <script src="js/enterprise-profile.js"></script>
</body>
</html>
